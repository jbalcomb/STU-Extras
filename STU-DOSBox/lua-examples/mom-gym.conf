# Master of Magic Gym environment.
# Launch MoM, play to the Overland position you want as the episode start; the
# Lua env snapshots it and then serves the RL loop (mom_gym.py connects).
# normal core is REQUIRED for savestates (episode reset).

[sdl]
fullscreen = false
output     = surface

[dosbox]
machine  = svga_s3
memsize  = 16

[cpu]
core   = normal
cycles = 10000

[lua]
script = /home/jbalcomb/STU/devel/STU-Extras/STU-DOSBox/lua-examples/mom-gym-env.lua

[autoexec]
@echo off
mount c /home/jbalcomb/STU_DBWD/MoM131
c:
REM JENNY arg skips the Logos and Intro
MAGIC.EXE JENNY
