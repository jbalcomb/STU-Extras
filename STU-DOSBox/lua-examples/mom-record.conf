# Master of Magic -- human session recording.
# Mirrors the baselines stage confs (svga_s3 / memsize 16 / normal core) so a
# recorded session matches your matchup-project environment.

[sdl]
fullscreen = false
output     = surface

[dosbox]
machine  = svga_s3
memsize  = 16

# normal core is required for savestates and wanted for deterministic runs
[cpu]
core   = normal
cycles = 10000

[lua]
script = /home/jbalcomb/STU/devel/STU-Extras/STU-DOSBox/lua-examples/mom-record.lua

[autoexec]
@echo off
mount c /home/jbalcomb/STU_DBWD/MoM131
c:
REM JENNY arg skips the Logos and Intro
MAGIC.EXE JENNY
