[sdl]
output=surface

# Savestate snapshot/restore requires the normal core: dynamic cores cache
# translated blocks, and a raw memory restore bypasses the write handlers
# that would invalidate them. (Normal core is also what you want for
# deterministic/reproducible RL runs.)
[cpu]
core=normal

[lua]
script=/home/jbalcomb/STU/devel/STU-Extras/STU-DOSBox/lua-examples/gym-env.lua

[autoexec]
@echo off
echo LUA_GYM_ENV_GUEST_RUNNING
