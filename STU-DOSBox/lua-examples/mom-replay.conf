# Master of Magic -- deterministic replay of a recorded human session.
# Identical machine setup to mom-record.conf; only the [lua] script differs.
#
# IMPORTANT: MoM calls Randomize() off the clock on every launch, so a replayed
# input trace will diverge from the original unless you pin the seed:
#     OG_FORCE_SEED=0x0012C0F8 DOSBOX_REPLAY_FILE=session.txt dosbox -conf mom-replay.conf
# Use the same seed the recording ran under.

[sdl]
fullscreen = false
output     = surface

[dosbox]
machine  = svga_s3
memsize  = 16

[cpu]
core   = normal
cycles = 10000

[lua]
script = /home/jbalcomb/STU/devel/STU-Extras/STU-DOSBox/lua-examples/replay.lua

[autoexec]
@echo off
mount c /home/jbalcomb/STU_DBWD/MoM131
c:
REM JENNY arg skips the Logos and Intro
MAGIC.EXE JENNY
